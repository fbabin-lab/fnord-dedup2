name: image-analysis
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LC_ALL: C.UTF-8
      LIBGUESTFS_BACKEND: direct
      LIBGUESTFS_BACKEND_SETTINGS: force_tcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Native image runtime and fixture tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-utils python3-guestfs libguestfs-tools linux-image-generic genisoimage e2fsprogs ntfs-3g dosfstools libarchive13t64
          sudo chmod a+r /boot/vmlinuz-*
      - name: Build and regression tests
        run: ./gradlew --no-daemon test installDist distTar
      - name: Native appliance preflight
        run: /usr/bin/python3 scripts/image-preflight.py
      - name: Native formats and real interruption recovery
        run: |
          /usr/bin/python3 scripts/image-smoke.py
          /usr/bin/python3 scripts/image-extra-smoke.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-test-reports
          path: |
            build/reports/tests/
            build/image-preflight-errors.json
          retention-days: 7
