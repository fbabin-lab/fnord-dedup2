name: build-and-test
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Native archive runtime and fixture tools
        run: sudo apt-get update && sudo apt-get install -y libarchive13t64 python3 zip p7zip-full
      - name: Build and unit/integration tests
        run: ./gradlew --no-daemon test installDist distTar :web-api:bootJar
      - name: Verify build without optional archive runtime
        env:
          FNORD_LIBARCHIVE: /definitely/missing/libarchive.so
        run: ./gradlew --no-daemon test --rerun-tasks
      - name: Installed application and process recovery tests
        run: |
          python3 scripts/process-smoke.py
          python3 scripts/rollback-smoke.py
      - name: Archive formats and process recovery
        run: python3 scripts/archive-smoke.py --require-7z --upstream-rar5
      - name: Database merge and atomic process recovery
        run: python3 scripts/database-merge-smoke.py
      - name: Cross-scan verification and process recovery
        run: python3 scripts/cross-scan-smoke.py
      - name: Prepare reproducible test harness
        if: always()
        run: ./gradlew --no-daemon testHarness
      - name: Upload test harness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-harness
          path: |
            build/test-harness/
            build/archive-fixtures/
          retention-days: 3
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: fnord-dedup2-linux
          path: build/distributions/*.tar
          retention-days: 7
      - name: Upload web application
        uses: actions/upload-artifact@v4
        with:
          name: fnord-dedup2-web
          path: web-api/build/libs/fnord-dedup2-web.jar
          retention-days: 7
