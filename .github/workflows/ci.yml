name: build-and-test
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and unit/integration tests
        run: ./gradlew --no-daemon test installDist distTar
      - name: Installed application and process recovery tests
        run: python3 scripts/process-smoke.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: fnord-dedup2-linux
          path: build/distributions/*.tar
          retention-days: 7
