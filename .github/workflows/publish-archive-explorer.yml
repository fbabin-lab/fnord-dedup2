name: publish-tested-archive-explorer
on:
  push:
    branches: [feature/web-archive-explorer-2026-10-04]
    paths: ['.archive-publish/**', '.github/workflows/publish-archive-explorer.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'fbabin-lab/fnord-dedup2' && github.ref == 'refs/heads/feature/web-archive-explorer-2026-10-04'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact implementation and publish on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 83dccef8215d972c2f489039fc03dd31bf433757 HEAD
          test -z "$(git diff --name-only 83dccef8215d972c2f489039fc03dd31bf433757 HEAD -- . ':(exclude).archive-publish/**' ':(exclude).github/workflows/publish-archive-explorer.yml')"
          python3 .archive-publish/decode.py
          git apply --check --index "$RUNNER_TEMP/archive-feature.patch"
          git apply --index "$RUNNER_TEMP/archive-feature.patch"
          git rm -r -- .archive-publish .github/workflows/publish-archive-explorer.yml
          git diff --cached --check
          git config user.name 'fbabin-lab'
          git config user.email '58642696+fbabin-lab@users.noreply.github.com'
          git commit -m 'Add scanned archive explorer and separate logical duplicate accounting'
          git push origin HEAD:refs/heads/feature/web-archive-explorer-2026-10-04
