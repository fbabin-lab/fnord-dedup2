plugins {
    id 'groovy'
    id 'application'
}

group = 'org.fnord'
version = '0.1.0'

repositories { mavenCentral() }

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.33'
    implementation 'org.apache.groovy:groovy-json:4.0.33'
    implementation 'org.duckdb:duckdb_jdbc:1.5.6.0'
    implementation 'info.picocli:picocli:4.7.7'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
application {
    mainClass = 'fnord.dedup.cli.Main'
    applicationDefaultJvmArgs = ['-Xms64m', '-Xmx512m']
}
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.encoding = 'UTF-8'
}
test {
    useJUnitPlatform()
    maxParallelForks = 1
    maxHeapSize = '512m'
    testLogging { events 'passed', 'skipped', 'failed' }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
distributions {
    main {
        contents {
            from('README.md')
            from('LICENSE')
            from('docs') { into 'docs' }
            from('examples') { into 'examples' }
        }
    }
}
