plugins {
    id 'groovy'
    id 'application'
}

group = 'org.fnord'
version = '0.1.0'
repositories { mavenCentral() }
dependencies {
    implementation 'org.apache.groovy:groovy:4.0.33'
    implementation 'org.apache.groovy:groovy-json:4.0.33'
    implementation 'org.duckdb:duckdb_jdbc:1.5.6.0'
    implementation 'info.picocli:picocli:4.7.7'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.platform:junit-platform-console'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
application {
    mainClass = 'fnord.dedup.cli.Main'
    applicationDefaultJvmArgs = ['-Xms64m', '-Xmx512m']
}
tasks.withType(GroovyCompile).configureEach { groovyOptions.encoding = 'UTF-8' }
def coreTests = ['StoredPathTest','HardenedStoredPathTest','WindowsCoreTest','WindowsNativeTest',
    'PortableCoreTest','PortableDatabasePathTest','DedupTest','CrossScanTest','CliTest','BulkWriterTest']
test {
    useJUnitPlatform()
    maxParallelForks = 1
    maxHeapSize = '512m'
    // Native archive/image suites and POSIX-only merge fixtures stay on Linux.
    // PortableCoreTest plus Windows process/launcher tests verify merge on Windows.
    if (System.getProperty('os.name').startsWith('Windows')) {
        filter { coreTests.each { includeTestsMatching 'fnord.dedup.' + it } }
    }
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}
tasks.register('windowsCoreTest', Test) {
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    maxHeapSize = '512m'
    filter { coreTests.each { includeTestsMatching 'fnord.dedup.' + it } }
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
distributions {
    main {
        contents {
            from('README.md')
            from('LICENSE')
            from('docs') { into 'docs' }
            from('examples') { into 'examples' }
            from('scripts/merge-database.groovy') { into 'scripts' }
        }
    }
}
// Opt-in portable harness for reproducing CI without another dependency download.
// Contains repository sources and public test dependencies only, never credentials.
tasks.register('testHarness', Sync) {
    into layout.buildDirectory.dir('test-harness')
    from('src') { into 'src' }
    from('scripts') { into 'scripts'; exclude '**/__pycache__/**' }
    from(configurations.testRuntimeClasspath) { into 'lib' }
    from('AGENTS.md', 'README.md', 'REQUIREMENTS.md', 'LICENSE',
         'build.gradle', 'settings.gradle', 'gradlew', 'gradlew.bat')
    from('docs') { into 'docs' }
    from('examples') { into 'examples' }
    from('web-api/src') { into 'web-api/src' }
    from('web-api/build.gradle') { into 'web-api' }
    from({ project(':web-api').configurations.testRuntimeClasspath }) { into 'web-lib' }
    from('web-ui') {
        into 'web-ui'
        include 'src/**', 'public/**', 'scripts/**', '*.json', '*.js', '*.mjs'
    }
}
